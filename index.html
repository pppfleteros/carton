<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartón</title>
<meta name="theme-color" content="#fcfbf6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartón">
<style>
  html, body { margin: 0; height: 100%; background: #fcfbf6; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .cargando { position: fixed; inset: 0; display: grid; place-items: center; }
  .cargando img { width: 140px; animation: latido 1.4s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(.93); opacity: .75; } }
</style>
</head>
<body>
<!-- Portada de la App de Cartón: da el ícono en el celular y adentro abre la app de Apps Script -->
<div class="cargando" id="cargando"><img src="logo-completo.png" alt="P.P.P"></div>
<iframe id="app" title="Cartón" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbxG4H6qanJ8YuVMK35zaHPLdwmwYF_uAmDiKwPiM803b2b-HlYk_w1O14NcUVpG0uXZIw/exec"></iframe>
<script>
  document.getElementById('app').onload = function () {
    setTimeout(function () { document.getElementById('cargando').style.display = 'none'; }, 300);
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
